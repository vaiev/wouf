# Settings of this folder's agent team. The lead fills them in during setup (.agents/skills/setup.md)
# and changes them when you ask ("use Codex for the worker", "rename the team to Atlas").
# Read by .agents/bin/team. Comments must be on their own line.

[team]
# The team's name. The lead is called by this name; bots are "<name> Worker", "<name> Review", ...
name = WOUF
# ask: questions and decisions go to you.
# auto: the lead decides with the decide bot and tells you afterwards. The hard limits in rules.md still
# go to you: anything irreversible, outward, paid, or new access.
autonomy = ask
# Which agent CLI runs the bots: claude, codex, agy, local. Setup writes the name; containers need one,
# because the team image installs that CLI. auto (host mode) = the CLI this session runs in (detected for
# Claude Code), else the first runner below that is installed.
runner = auto

[environment]
# Where bots run.
#   container (recommended): one image for the whole team holds the agent CLIs and tools; every bot has its
#              own storage; a container exists only while a bot works on a task (nothing runs while idle).
#              Nothing of this folder or this computer is mounted; the lead copies briefs and inputs in and
#              results out.
#   bwrap:     Linux without Docker or Podman: a bubblewrap sandbox per run (bubblewrap installed, unprivileged
#              user namespaces allowed). Own namespaces and storage (env/<id>/box), nothing of your home, keys only
#              on stdin; the team prefix env/_prefix stands in for the image. Weaker than a container: no syscall
#              filter, cpus and memory only when a systemd user scope works, setup and installs that need root are
#              skipped (you install those). network = none or egress; bridge is refused.
#   host:      no sandbox; bots run in .agents/team/env/<id>/ on this computer. Only for trying things out.
#   undeclared: not set up yet; the lead runs setup first.
mode = undeclared
# docker or podman
engine = docker
# Empty = this computer. ssh://<alias> = Docker on a VM or VPS reached through an SSH alias (never an address).
docker_host =
# Image for the bot containers. It needs git and python3; node:lts has both, plus npm for the agent CLIs.
image = node:lts
# The user bots run as inside the container (not root). Containers drop all capabilities, so even root
# could not act as root there.
user = node
# bridge = internet access (needed for cloud models). none = offline (local models in the container only).
# egress = only [egress] allow, the runner's needs and a brief's Egress: line, through a proxy per run; see [egress].
# mode = bwrap refuses bridge: a cloud CLI there needs egress.
network = bridge
cpus = 2
memory = 4g
# Optional command run as root when the team image is built, before the runners' installs.
# Tools the bots ask for later are added with `.agents/bin/team install -- <command>` (team/provision.sh).
setup =
# A bot that works longer than this on one task is stopped.
timeout_minutes = 30

[tiers]
# Default tier per bot; a brief can override it.
# strong = the provider's top model: default for real work, review and decisions.
# mid = the provider's middle model: bounded work that still reads code (scout and bugfixer declare it). A runner
#       without a mid model runs mid on strong; a mid run that misses its criteria goes again on strong.
# light = the provider's small model: mechanical, frequent work.
worker = strong
review = strong
decide = strong
routine = light

# One section per agent CLI.
#   install:      run as root when the team image is built, to install the CLI
#   command:      how a bot runs inside its container. {prompt} = the boot prompt with the brief, {workdir} = task folder.
#                 Inside a disposable container bots may run without permission prompts.
#   host_command: the same on this computer (mode = host), with the CLI's own safe defaults
#   model_flag, strong, mid, light: the model per tier (three tiers: strong, mid, light). Empty = the CLI's own
#                 default model; an empty mid runs on strong.
#                 `team run --model NAME` overrides the tier for one run.
#   effort_arg:   how the CLI takes a reasoning effort ({effort}); used when a run or bot names one.
#   auth:         environment variables the CLI reads its key from. The value comes from .agents/bin/secret
#                 on each run and is never stored in the container.
#                 auth = login instead: the CLI is signed in to a subscription inside each bot's own storage;
#                 the human runs `.agents/bin/team bot login <id>` once per bot in their own terminal.
#   login:        the CLI's sign-in command for auth = login (codex login --device-auth, agy)
#   login_check:  a shell test that the login is there (test -s "$HOME/.codex/auth.json"); team doctor runs it
#   limit_patterns: a regular expression for the CLI's usage-limit messages; empty = the built-in one. A run that
#                 ends with one is `limited` until the reset time it names, and its unfinished work is a WIP commit.
#   mcp_arg, mcp_path, mcp_format: how the CLI gets the bot's connectors (MCP servers): an argument with the
#                 config file ({mcp}), or a path in the task folder where the config is written; the format is
#                 claude (.mcp.json style) or gemini (settings.json style, Gemini-family CLIs). Empty: connectors are not wired.

[runner.claude]
install = npm install -g @anthropic-ai/claude-code
# auto: the CLI's own classifier still checks risky actions, also inside the container.
command = claude -p {prompt} --permission-mode auto
host_command = claude -p {prompt} --permission-mode acceptEdits
model_flag = --model
strong = opus
mid =
light = haiku
effort_arg = --effort {effort}
auth = CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY
mcp_arg = --mcp-config {mcp}
mcp_path =
mcp_format = claude

[runner.codex]
install = npm install -g @openai/codex
command = codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check --ephemeral {prompt}
host_command = codex exec --sandbox workspace-write --skip-git-repo-check {prompt}
model_flag = -m
strong =
mid =
light =
effort_arg = -c model_reasoning_effort={effort}
auth = OPENAI_API_KEY
mcp_arg =
mcp_path =
mcp_format = claude

[runner.agy]
# Antigravity CLI (it replaced Gemini CLI). It keeps its sign-in in the system keyring: in a container a
# D-Bus session and an unlocked gnome-keyring stand in for it (the keyring lives in the bot's own storage).
install = apt-get update && apt-get install -y --no-install-recommends gnome-keyring dbus && curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- --dir /usr/local/bin
# Print mode soft-denies every tool call no permission rule allows and stops after 5 minutes by default; inside
# the disposable container all calls are approved, like codex above. On this computer agy keeps its own rules.
command = dbus-run-session -- sh -c 'echo bot-keyring | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1; exec agy "$@"' agy -p {prompt} --dangerously-skip-permissions --print-timeout 55m
host_command = agy -p {prompt} --print-timeout 55m
model_flag = --model
strong =
mid =
light =
effort_arg = --effort {effort}
auth = login
login = dbus-run-session -- sh -c 'echo bot-keyring | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1; exec agy'
login_check = test -s "$HOME/.local/share/keyrings/login.keyring"
mcp_arg =
mcp_path =
mcp_format = gemini

[runner.local]
# Any agent CLI that talks to a local model server (Ollama, llama.cpp, LM Studio). From a container the
# host is usually reachable as host.docker.internal. Fill in install, command and the model names.
install =
command =
host_command =
model_flag =
strong =
mid =
light =
auth =
mcp_arg =
mcp_path =
mcp_format = claude

[flow]
# team flow and team gate. gate: the pre-gate command, run on the branch head in a sandbox without keys (empty:
# only the brief's Paths are checked), e.g. make test; WOUF_BASE and WOUF_HEAD name the task's first and last commit.
# Each gate run gets a fresh checkout, HOME and work folder, and git ignores the global and system config and
# every hook (GIT_CONFIG_GLOBAL=/dev/null, an empty read-only core.hooksPath), during checkout and test.
# WOUF_CACHE is a folder on the gate storage that survives runs (the checkout does not); put build caches there,
# e.g. gate = CARGO_TARGET_DIR="$WOUF_CACHE/target" cargo test. The cache is shared by every task's gate and holds
# untrusted data: any earlier gate could have written it. The gate itself never runs anything from it nor puts it
# on PATH or HOME; a gate command that runs files from it trusts every earlier gate. Empty it with
# .agents/bin/team gate --fresh-cache. gate_network: none (default) or bridge when the gate must
# download dependencies. Bots per step: scout, research, review, review2 and bugfixer (defaults: those ids).
# research runs at the same time as the scout when a brief says Research: yes; review2 runs the second review
# at the same time as the first (class reviews = 2, after a green gate only). Each runs only when its bot is
# declared and active; else there is no research and the reviews run one after the other. A complex or
# security brief with Paths gets the context graph (in/CONTEXT_GRAPH.md) instead of a scout unless it says
# Scout: yes. review_effort, research_effort, scout_effort, bugfixer_effort: the effort for those runs.
# fallback.<runner> = <runner>: where a step goes once when its runner hits a usage limit, e.g.
# fallback.claude = codex.
gate =
gate_network = none

# Task classes (the brief's Class: line) for team flow. Without a section a class keeps its built-in meaning:
#   mechanical: worker, light, effort low, 1 review     standard: worker, strong, medium, 1 review
#   complex: worker, strong, high, scout, 1 review       security: worker, strong, high, scout, 2 reviews
#   decision: decide, strong, high, no review            analysis: worker, strong, medium, no review
#   plan: planner, strong, high, scout, no review, no commits (a plan and draft briefs; nothing is dispatched)
# Keys: bot, runner, tier (light, mid or strong; complex, security, decision and plan stay strong), model
# (overrides the tier), effort, reviews (0-3), review_runners (one runner per review, e.g. codex agy), scout (yes/no). A cheaper model for planning: [class.plan] with model = <a model of
# the runner>. Example:
# [class.standard]
# runner = claude
# review_runners = codex

[budget]
# Token caps, off by default; every key is optional (empty or left out: no cap). A run's tokens are the numbers its
# receipt records (input, cache read, cache write and output, summed); runs whose CLI reports none count nothing.
# per_day: the tokens of all bots per UTC day; per_day.<bot> = N: one bot's own, e.g. per_day.worker = 2000000.
# Once today's tokens reach a cap, team run does not start the run: it ends skipped (over budget) and a flow waits
# as on a usage limit until the next UTC midnight, without a fallback. per_run: a run whose own tokens pass it is
# marked over-budget (never cut off mid-run); its flow starts no other step until you looked (team flow TASK
# --retry goes on). team stats shows today's tokens against the caps. Only tokens: no money, not the lead's session.
# A value that is not a whole number of tokens stops team run before anything starts.
per_run =
per_day =

[guard]
# .agents/bin/guard, a PreToolUse hook for the lead's own session (Claude Code: "python3 .agents/bin/guard hook").
# secret_dirs: folders no command may name (e.g. ~/.password-store). write_roots: folders outside this project the
# lead may write (e.g. its CLI's memory folder). Extra deny rules: team/guard-deny.txt, one regex per line.
secret_dirs =
write_roots =

# Optional sections, not set by default (add the section to use one):
# [knowledge] sources = <files or folders>: local project files team ask and log ask search besides
#   team/knowledge/*.md, comma or newline separated, relative to the project, read only (Markdown in a folder, any
#   UTF-8 text file named by itself). URLs and paths outside the project are skipped and named. Never staged into a
#   bot's sandbox: bots search team knowledge and accepted lessons only.
# [classify]: the rules of the INIT classifier of team goal new (no model). security_globs = <globs> (comma or space
#   separated): a path that matches makes a goal class security (default .agents/bin/**, **/auth/**, **/secret*,
#   .github/workflows/**). keywords.<class> = <words> (comma separated, whole words): replaces that class's keyword
#   list, e.g. keywords.mechanical = rename, typo, bump. Without the section the built-in rules apply.
# [egress]: only with [environment] network = egress (container or bwrap mode; host mode refuses it). In container
#   mode each run gets two networks, wouf-<run>-in (internal, no way out) for the bot and wouf-<run>-out, and a
#   proxy container on both; the bot gets HTTPS_PROXY and HTTP_PROXY and reaches nothing else, DNS included. Needs Podman with netavark and
#   aardvark-dns 1.11.0 or newer, or Docker 26.0.0, 25.0.5 or 23.0.11 or newer in its line; older ones are refused.
#   In bwrap mode the proxy runs in a sandbox of its own and the bot, with no network, reaches it through a socket.
#   Keys still reach the bot as with bridge (no key proxy yet), so its CLI's model API and login hosts must be open.
#   proxy = <path>: egress_proxy.py of the egress-proxy tool in the catalog, copied into this project (required).
#   allow = <hosts>: the base list of every run, host names (pypi.org) or .suffix entries (.pythonhosted.org: every
#   name below it, not the name itself), comma or space separated; no addresses, ports or patterns. Empty: nothing
#   but the proxy. needs.<runner> = <hosts>: the model API and login hosts of that CLI; they join the runs of that
#   runner only, so a claude bot never reaches the codex hosts. Without it, claude gets api.anthropic.com, claude.ai,
#   platform.claude.com and codex api.openai.com, chatgpt.com, auth.openai.com; another CLI gets none and says so
#   at start. A brief's `Egress: <hosts>` line adds hosts for that task; one outside that list needs the lead's yes
#   for that task first: team decision add "Egress: <hosts>" --task <task> --authority lead ... Review and decide
#   get allow and their runner's needs only. team run shows the run's list at start; the proxy's log comes back as
#   egress.log in the run folder, and team result shows it, masked. UNVERIFIED until the lead's trial: run the CLI
#   once, read the refused hosts in egress.log, and set needs.<runner> and allow to what it really needs.
